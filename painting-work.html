    <style>
        /* ==========================================
           LIGHTBOX — FROSTED FLOAT (方案 3: 磨砂呼吸放大)
           ========================================== */

        /* 鼠标悬停在画作上显示放大光标 */
        .work-detail-image img {
            cursor: zoom-in;
        }

        /* 磨砂半透明全屏遮罩 */
        .lightbox-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(238, 238, 238, 0.82);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 1000;

            display: flex;
            justify-content: center;
            align-items: center;

            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.28s cubic-bezier(0.16, 1, 0.3, 1),
                        visibility 0.28s cubic-bezier(0.16, 1, 0.3, 1);
            cursor: zoom-out;
        }

        /* 激活显示 */
        .lightbox-overlay.active {
            opacity: 1;
            visibility: visible;
            pointer-events: auto;
        }

        /* 居中大图与柔和浮空投影 */
        .lightbox-image {
            max-width: 90vw;
            max-height: 90vh;
            width: auto;
            height: auto;
            object-fit: contain;
            user-select: none;
            cursor: zoom-out;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            transform: scale(0.96);
            transition: transform 0.28s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .lightbox-overlay.active .lightbox-image {
            transform: scale(1);
        }

        /* 右上角极简微型圆圈关闭按钮 */
        .lightbox-close {
            position: absolute;
            top: 24px;
            right: 28px;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: #111111;
            font-size: 18px;
            line-height: 1;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .lightbox-close:hover {
            background: rgba(0, 0, 0, 0.1);
            transform: scale(1.05);
        }
    </style>

</head>

/* ==========================================
   获取当前作品编号
   ========================================== */

const params =
    new URLSearchParams(window.location.search);


let current =
    parseInt(params.get("id"), 10);


/* 没有 id 时默认第一件 */

if (Number.isNaN(current)) {

    current = 0;

}


/* 防止编号超出范围 */

if (current < 0) {

    current = works.length - 1;

}


if (current >= works.length) {

    current = 0;

}



/* ==========================================
   获取页面元素
   ========================================== */

const image =
    document.getElementById("detail-image");

const title =
    document.getElementById("work-title");

const year =
    document.getElementById("work-year");

const size =
    document.getElementById("work-size");

const medium =
    document.getElementById("work-medium");

const prev =
    document.getElementById("prev-work");

const next =
    document.getElementById("next-work");



/* ==========================================
   当前作品
   ========================================== */

const work =
    works[current];



/* ==========================================
   从文件名提取尺寸和材料
   ========================================== */

let information =
    work.image.replace(/\.[^/.]+$/, "");


/* 去掉最前面的年份 */

information =
    information.replace(/^\d{4}\s+/, "");


/* 尺寸 */

const sizeMatch =
    information.match(/^(\S+)/);


/* 材料 */

let dimensions = "";

let materials = "";


if (sizeMatch) {

    dimensions =
        sizeMatch[1];

    materials =
        information
            .substring(dimensions.length)
            .trim();

}


/* ==========================================
   更新页面
   ========================================== */

image.src =
    encodeURI(
        "images/painting/" +
        work.year +
        "/" +
        work.image
    );


image.alt =
    work.image;


title.textContent =
    "UNTITLED";


year.textContent =
    work.year;


size.textContent =
    dimensions;


medium.textContent =
    materials;



/* ==========================================
   上一件 / 下一件
   ========================================== */

const previousIndex =
    (current - 1 + works.length) %
    works.length;


const nextIndex =
    (current + 1) %
    works.length;


prev.href =
    "painting-work.html?id=" +
    previousIndex;


next.href =
    "painting-work.html?id=" +
    nextIndex;



/* ==========================================
   浏览器标题
   ========================================== */

document.title =
    "UNTITLED — Jinhao Wang";



/* ==========================================
   LIGHTBOX INTERACTION (方案 3 交互逻辑)
   ========================================== */

const lightboxOverlay =
    document.getElementById("lightbox-overlay");

const lightboxImg =
    document.getElementById("lightbox-img");

const lightboxClose =
    document.getElementById("lightbox-close");


function openLightbox() {
    lightboxImg.src = image.src;
    lightboxImg.alt = image.alt;
    lightboxOverlay.classList.add("active");
}

function closeLightbox() {
    lightboxOverlay.classList.remove("active");
}

// 点击画作图片放大
image.addEventListener("click", openLightbox);

// 点击关闭按钮或背景空白处关闭
lightboxClose.addEventListener("click", closeLightbox);
lightboxOverlay.addEventListener("click", function(event) {
    if (event.target === lightboxOverlay || event.target === lightboxImg) {
        closeLightbox();
    }
});



/* ==========================================
   键盘控制

   ← Previous
   → Next
   Escape Close Lightbox
   ========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        // 如果灯箱处于打开状态，按 Esc 优先关闭灯箱
        if (event.key === "Escape" && lightboxOverlay.classList.contains("active")) {
            closeLightbox();
            return;
        }

        // 仅在灯箱未开启时响应左右切画
        if (!lightboxOverlay.classList.contains("active")) {

            if (event.key === "ArrowLeft") {

                window.location.href =
                    "painting-work.html?id=" +
                    previousIndex;

            }


            if (event.key === "ArrowRight") {

                window.location.href =
                    "painting-work.html?id=" +
                    nextIndex;

            }

        }

    }
);
