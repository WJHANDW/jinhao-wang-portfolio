/* ==========================================
   获取当前作品编号
   ========================================== */

const params =
    new URLSearchParams(window.location.search);


let current =
    parseInt(params.get("id"), 10);


/* 没有 id 时默认第一件 */

if (Number.isNaN(current)) {

    current = 0;

}


/* 防止编号超出范围 */

if (current < 0) {

    current = works.length - 1;

}


if (current >= works.length) {

    current = 0;

}



/* ==========================================
   获取页面元素
   ========================================== */

const image =
    document.getElementById("detail-image");

const title =
    document.getElementById("work-title");

const year =
    document.getElementById("work-year");

const size =
    document.getElementById("work-size");

const medium =
    document.getElementById("work-medium");

const prev =
    document.getElementById("prev-work");

const next =
    document.getElementById("next-work");



/* ==========================================
   当前作品
   ========================================== */

const work =
    works[current];



/* ==========================================
   从文件名提取尺寸和材料
   ========================================== */

/*
   例如：

   2026 117×120cm 木画框，图片，塑料袋，胶带...

   会自动得到：

   尺寸：
   117×120cm

   材料：
   木画框，图片，塑料袋，胶带...
*/


let information =
    work.image.replace(/\.[^/.]+$/, "");


/* 去掉最前面的年份 */

information =
    information.replace(/^\d{4}\s+/, "");


/* 尺寸 */

const sizeMatch =
    information.match(/^(\S+)/);


/* 材料 */

let dimensions = "";

let materials = "";


if (sizeMatch) {

    dimensions =
        sizeMatch[1];

    materials =
        information
            .substring(dimensions.length)
            .trim();

}


/* ==========================================
   更新页面
   ========================================== */

image.src =
    encodeURI(
        "images/painting/" +
        work.year +
        "/" +
        work.image
    );


image.alt =
    work.image;


title.textContent =
    "UNTITLED";


year.textContent =
    work.year;


size.textContent =
    dimensions;


medium.textContent =
    materials;



/* ==========================================
   上一件 / 下一件
   ========================================== */

const previousIndex =
    (current - 1 + works.length) %
    works.length;


const nextIndex =
    (current + 1) %
    works.length;


prev.href =
    "painting-work.html?id=" +
    previousIndex;


next.href =
    "painting-work.html?id=" +
    nextIndex;



/* ==========================================
   浏览器标题
   ========================================== */

document.title =
    "UNTITLED — Jinhao Wang";



/* ==========================================
   键盘控制
   ========================================== */

document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowLeft") {

            window.location.href =
                "painting-work.html?id=" +
                previousIndex;

        }


        if (event.key === "ArrowRight") {

            window.location.href =
                "painting-work.html?id=" +
                nextIndex;

        }

    }
);
