<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Digital Collage — Jinhao Wang</title>

    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <style>
        /* 真正的横向自然分布 3 列瀑布流网格 */
        .true-masonry {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 28px;
            width: 76%;
            max-width: 1120px;
            margin: 0 auto;
        }

        .masonry-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 50px;
            min-width: 0;
        }

        .masonry-col .archive-item {
            display: block;
            margin: 0;
            text-decoration: none;
            transition: opacity 0.25s ease;
        }

        .masonry-col .archive-item img {
            display: block;
            width: 100%;
            height: auto;
        }

        .masonry-col .archive-item:hover {
            opacity: 0.75;
        }

        @media (max-width: 700px) {
            .true-masonry {
                width: 100%;
                flex-direction: column;
                gap: 50px;
            }
        }
    </style>

</head>


<body>


    <!-- ========================================
         SITE NAVIGATION
         ======================================== -->

    <header class="site-header">

        <nav>
            <a href="index.html">HOME</a>
            <a href="works.html">WORKS</a>
            <a href="about.html">ABOUT</a>
        </nav>

    </header>


    <!-- ========================================
         DIGITAL COLLAGE ARCHIVE
         ======================================== -->

    <main class="project-page">

        <div class="project-header">

            <h1>DIGITAL COLLAGE</h1>

            <button
                id="sort-button"
                type="button"
            >
                SORT: NEWEST → OLDEST
            </button>

        </div>


        <!-- ========================================
             ARCHIVE (TRUE MASONRY GRID)
             ======================================== -->

        <div id="digital-collage-archive" class="true-masonry"></div>

    </main>


    <!-- ========================================
         WORK DATA + ARCHIVE LOGIC
         ======================================== -->

    <script>

        const works = [

            /* ==============================
               2026
               ============================== */

            { year: 2026, image: "gdd.png" },
            { year: 2026, image: "swdf.png" },
            { year: 2026, image: "qwf.png" },
            { year: 2026, image: "vvv.png" },
            { year: 2026, image: "hhgf.png" },
            { year: 2026, image: "efwqr.png" },
            { year: 2026, image: "kjgfty.png" },
            { year: 2026, image: "fghjng.png" },
            { year: 2026, image: "khyi.png" },
            { year: 2026, image: "dlu.png" },
            { year: 2026, image: "iii.png" },
            { year: 2026, image: "lllp.png" },
            { year: 2026, image: "hhd.png" },
            { year: 2026, image: "ddddd.png" },
            { year: 2026, image: "ll.png" },
            { year: 2026, image: "ggg.png" },
            { year: 2026, image: "gfuii.png" },
            { year: 2026, image: "one.png" },
            { year: 2026, image: "ffffxxxx.png" },
            { year: 2026, image: "555555.png" },
            { year: 2026, image: "666.png" },
            { year: 2026, image: "bdbbv.png" },
            { year: 2026, image: "mbbf.png" },
            { year: 2026, image: "gkitr.png" },


            /* ==============================
               2025
               ============================== */

            { year: 2025, image: "1.jpg" },
            { year: 2025, image: "2.jpg" },
            { year: 2025, image: "3.jpg" },
            { year: 2025, image: "4.jpg" },
            { year: 2025, image: "5.jpg" },
            { year: 2025, image: "6.jpg" },
            { year: 2025, image: "7.jpg" },
            { year: 2025, image: "10.jpg" },
            { year: 2025, image: "11.jpg" },
            { year: 2025, image: "12.jpg" },
            { year: 2025, image: "13.jpg" },
            { year: 2025, image: "15.jpg" },
            { year: 2025, image: "16.png" }

        ];


        /* ========================================
           ELEMENTS
           ======================================== */

        const archive =
            document.getElementById("digital-collage-archive");

        const sortButton =
            document.getElementById("sort-button");


        /* ========================================
           SORT STATE
           ======================================== */

        let newestFirst = true;


        /* ========================================
           UPDATE SORT BUTTON
           ======================================== */

        function updateSortButton() {

            sortButton.textContent = newestFirst
                ? "SORT: NEWEST → OLDEST"
                : "SORT: OLDEST → NEWEST";

        }


        /* ========================================
           RENDER WORKS (横向蛇形推进)
           ======================================== */

        function renderWorks() {

            archive.innerHTML = "";

            /* 电脑端创建 3 列容器，手机端 1 列 */
            const isMobile = window.innerWidth <= 700;
            const columnCount = isMobile ? 1 : 3;
            const columns = [];

            for (let i = 0; i < columnCount; i++) {
                const col = document.createElement("div");
                col.className = "masonry-col";
                archive.appendChild(col);
                columns.push(col);
            }

            const sortedWorks = works
                .map((work, index) => ({
                    ...work,
                    originalIndex: index
                }))
                .sort((a, b) => {
                    return newestFirst
                        ? b.year - a.year
                        : a.year - b.year;
                });

            /* 从左到右依次分发：第1张给左列，第2张给中列，第3张给右列... */
            sortedWorks.forEach((work, index) => {

                const link =
                    document.createElement("a");

                link.href =
                    `digital-collage-work.html?id=${work.originalIndex}`;

                link.className =
                    "archive-item";

                const image =
                    document.createElement("img");

                const thumbName = work.image.replace(/\.[^/.]+$/, "") + ".jpg";
                image.src = `images/digital collage/thumbs/${thumbName}`;

                image.alt =
                    `Digital Collage ${work.year}`;

                image.loading =
                    "lazy";

                image.addEventListener(
                    "error",
                    () => {
                        console.log(
                            "图片加载失败：",
                            image.src
                        );
                    }
                );

                link.appendChild(image);

                /* 依次分配到各个列 */
                const targetCol = columns[index % columnCount];
                targetCol.appendChild(link);

            });

        }


        /* ========================================
           SORT BUTTON
           ======================================== */

        sortButton.addEventListener(
            "click",
            () => {

                newestFirst =
                    !newestFirst;

                updateSortButton();

                renderWorks();

            }
        );


        /* ========================================
           SMART HEADER HIDE / SHOW ON SCROLL
           ======================================== */

        const header = document.querySelector(".site-header");
        let lastScrollY = window.pageYOffset;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.pageYOffset;

            if (currentScrollY <= 80) {
                header.classList.remove("header-hidden");
                lastScrollY = currentScrollY;
                return;
            }

            if (Math.abs(currentScrollY - lastScrollY) < 10) {
                return;
            }

            if (currentScrollY > lastScrollY) {
                header.classList.add("header-hidden");
            } else {
                header.classList.remove("header-hidden");
            }

            lastScrollY = currentScrollY;
        }, { passive: true });


        /* ========================================
           窗口尺寸变化自适应
           ======================================== */

        let resizeTimer;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderWorks, 150);
        });


        /* ========================================
           INITIALIZE
           ======================================== */

        updateSortButton();

        renderWorks();

    </script>


</body>

</html>
