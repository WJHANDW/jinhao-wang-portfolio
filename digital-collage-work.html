/* ==========================================
   GET CURRENT WORK ID
   ========================================== */


const params =
    new URLSearchParams(window.location.search);


let current =
    parseInt(params.get("id"), 10);



/* 没有 id 时默认第一件 */

if (Number.isNaN(current)) {

    current = 0;

}



/* ==========================================
   防止编号超出范围
   ========================================== */


if (current < 0) {

    current = works.length - 1;

}


if (current >= works.length) {

    current = 0;

}



/* ==========================================
   GET PAGE ELEMENTS
   ========================================== */


const image =
    document.getElementById("detail-image");


const title =
    document.getElementById("work-title");


const year =
    document.getElementById("work-year");


const medium =
    document.getElementById("work-medium");


const prev =
    document.getElementById("prev-work");


const next =
    document.getElementById("next-work");



/* ==========================================
   CURRENT WORK
   ========================================== */


const work =
    works[current];



/* ==========================================
   UPDATE PAGE
   ========================================== */


image.src =
    "images/digital%20collage/" + work.image;


image.alt =
    work.title + " " + work.year;


title.textContent =
    work.title;


year.textContent =
    work.year;


medium.textContent =
    work.medium;



/* ==========================================
   PREVIOUS / NEXT (LINKS POINT TO CURRENT SCRIPT)
   ========================================== */


const previousIndex =
    (current - 1 + works.length) % works.length;


const nextIndex =
    (current + 1) % works.length;


prev.href =
    "digital-collage-work.html?id=" + previousIndex;


next.href =
    "digital-collage-work.html?id=" + nextIndex;



/* ==========================================
   BROWSER TITLE
   ========================================== */


document.title =
    work.title + " — Jinhao Wang";



/* ==========================================
   KEYBOARD CONTROL

   ← Previous
   → Next

   ========================================== */


document.addEventListener(
    "keydown",
    function(event) {

        if (event.key === "ArrowLeft") {

            window.location.href =
                "digital-collage-work.html?id=" + previousIndex;

        }


        if (event.key === "ArrowRight") {

            window.location.href =
                "digital-collage-work.html?id=" + nextIndex;

        }

    }
);
