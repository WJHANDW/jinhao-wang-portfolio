<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jinhao Wang</title>

    <!-- 方案 C：解密档案旧铅字库 (Noto Serif SC) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="style.css?v=9">
    <link rel="stylesheet" href="installation/undercarriage.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>


<body>

    <!-- 方案 C 定制：4.0px 粗粝炭棒石墨滤镜 -->
    <svg style="position: absolute; width: 0; height: 0; pointer-events: none;" aria-hidden="true">
        <filter id="pencil-texture">
            <feTurbulence type="fractalNoise" baseFrequency="0.75" numOctaves="3" result="noise" />
            <feDisplacementMap in="SourceGraphic" in2="noise" scale="4.0" xChannelSelector="R" yChannelSelector="G" result="displaced" />
            <feComposite in="displaced" in2="noise" operator="arithmetic" k1="0.25" k2="0.8" k3="0" k4="0" />
        </filter>
    </svg>

    <!-- ========================================
         SITE NAVIGATION
         ======================================== -->

    <header class="site-header">

        <nav>
            <a href="index.html">HOME</a>
            <a href="works.html">WORKS</a>
            <a href="about.html">ABOUT</a>
        </nav>

    </header>


    <!-- ========================================
         HOME PAGE (HERO)
         ======================================== -->

    <main class="home">

        <section class="hero">

            <!-- Hero Image -->
            <div class="hero-image">
                <img
                    src="images/digital collage/home-hero-small.jpg"
                    alt="Jinhao Wang"
                >
            </div>

            <!-- Hero Text -->
            <div class="hero-text">
                <h1>Jinhao Wang</h1>
                <p>
                    于我而言，创作就是吃什么拉什么的过程，<br>
                    它应该日常化，应该关注我们摄入了什么。
                </p>
            </div>

        </section>

    </main>


    <!-- ========================================
         INSTALLATION: GRAPHIC CARD DEALER (第二屏)
         ======================================== -->

    <section class="installation-section">

        <!-- 顶部装置区：发牌机 + 右侧无框自然散乱废牌堆 -->
        <div class="dealer-top-cluster">
            <div class="dealer-chassis-stage">
                <div id="dealer-slot" class="dealer-dispenser-box">
                    <div class="dealer-slot"></div>
                </div>
            </div>

            <!-- 无框自由散乱废牌堆 -->
            <div id="discard-free-pile" class="discard-free-pile"></div>
        </div>

        <!-- 牌桌网格 -->
        <div class="dealer-table">
            <div id="cards-grid" class="cards-grid"></div>
        </div>

    </section>


    <!-- ========================================
         SMART SLIDE HEADER SCRIPT
         ======================================== -->

    <script>
        const header = document.querySelector(".site-header");
        let lastScrollY = window.pageYOffset;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.pageYOffset;

            if (currentScrollY <= 80) {
                header.classList.remove("header-hidden");
                lastScrollY = currentScrollY;
                return;
            }

            if (Math.abs(currentScrollY - lastScrollY) < 10) {
                return;
            }

            if (currentScrollY > lastScrollY) {
                header.classList.add("header-hidden");
            } else {
                header.classList.remove("header-hidden");
            }

            lastScrollY = currentScrollY;
        }, { passive: true });
    </script>

    <!-- 极简发牌与整席汇聚回收逻辑 -->
    <script src="installation/undercarriage.js"></script>

</body>

</html>
