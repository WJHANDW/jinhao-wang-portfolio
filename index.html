<!DOCTYPE html>
<html lang="zh-CN">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Jinhao Wang</title>

    <link rel="stylesheet" href="style.css?v=5">
    <link rel="stylesheet" href="installation/undercarriage.css">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

</head>


<body>


    <!-- ========================================
         SITE NAVIGATION
         ======================================== -->

    <header class="site-header">

        <nav>
            <a href="index.html">HOME</a>
            <a href="works.html">WORKS</a>
            <a href="about.html">ABOUT</a>
        </nav>

    </header>


    <!-- ========================================
         HOME PAGE (HERO)
         ======================================== -->

    <main class="home">

        <section class="hero">

            <!-- Hero Image -->
            <div class="hero-image">
                <img
                    src="images/digital collage/home-hero-small.jpg"
                    alt="Jinhao Wang"
                >
            </div>

            <!-- Hero Text -->
            <div class="hero-text">
                <h1>Jinhao Wang</h1>
                <p>
                    于我而言，创作就是吃什么拉什么的过程，<br>
                    它应该日常化，应该关注我们摄入了什么。
                </p>
            </div>

        </section>

    </main>


    <!-- ========================================
         INSTALLATION: GRAPHIC CARD DEALER (第二屏)
         ======================================== -->

    <section class="installation-section">

        <!-- 立体发牌机底座与旋转仓 -->
        <div class="dealer-chassis-stage">
            <div id="dealer-slot" class="dealer-dispenser-box">
                <div class="dealer-slot"></div>
            </div>
        </div>

        <!-- 固定卡槽阵列牌桌 -->
        <div class="dealer-table">
            <div id="cards-grid" class="cards-grid"></div>
        </div>

    </section>


    <!-- ========================================
         SMART SLIDE HEADER SCRIPT
         ======================================== -->

    <script>
        const header = document.querySelector(".site-header");
        let lastScrollY = window.pageYOffset;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.pageYOffset;

            if (currentScrollY <= 80) {
                header.classList.remove("header-hidden");
                lastScrollY = currentScrollY;
                return;
            }

            if (Math.abs(currentScrollY - lastScrollY) < 10) {
                return;
            }

            if (currentScrollY > lastScrollY) {
                header.classList.add("header-hidden");
            } else {
                header.classList.remove("header-hidden");
            }

            lastScrollY = currentScrollY;
        }, { passive: true });
    </script>

    <!-- 极简立体发牌逻辑 -->
    <script src="installation/undercarriage.js"></script>

</body>

</html>
