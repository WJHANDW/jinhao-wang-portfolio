        .true-masonry {

            gap: 28px;
            width: 76%;
            max-width: 1120px;

            display: flex;
            flex-direction: column;

        }

            display: block;
            margin: 0;
            text-decoration: none;
            transition: opacity 0.25s ease;
        }

        .masonry-col .archive-item img {
            display: block;
            width: 100%;
            height: auto;
        }

        .masonry-col .archive-item:hover {
            opacity: 0.75;
        }

        @media (max-width: 700px) {
            .true-masonry {
                width: 100%;
                flex-direction: column;
                gap: 50px;
            }
        }
    </style>

        /* ========================================
           ELEMENTS
           ======================================== */

        const archive =
            document.getElementById("painting-archive");

        const sortButton =
            document.getElementById("sort-button");


        /* ========================================
           SORT STATE
           ======================================== */

        let newestFirst = true;


        /* ========================================
           GENERATE TRUE MASONRY (横向蛇形咬合推进)
           ======================================== */

        function renderArchive() {

            archive.innerHTML = "";

            /* 电脑端创建 3 列容器，手机端创建 1 列 */
            const isMobile = window.innerWidth <= 700;
            const columnCount = isMobile ? 1 : 3;
            const columns = [];

            for (let i = 0; i < columnCount; i++) {
                const col = document.createElement("div");
                col.className = "masonry-col";
                archive.appendChild(col);
                columns.push(col);
            }

            /* 排序副本 */
            const sortedWorks = works
                .map((work, index) => ({
                    ...work,
                    originalIndex: index
                }))
                .sort((a, b) => {
                    const yearA = Number(a.year);
                    const yearB = Number(b.year);

                    return newestFirst
                        ? yearB - yearA
                        : yearA - yearB;
                });

            /* 从左到右依次轮流把作品分派到 3 列里 */
            sortedWorks.forEach((work, index) => {

                const link =
                    document.createElement("a");

                link.href =
                    "painting-work.html?id=" +
                    work.originalIndex;

                link.className =
                    "archive-item";

                const image =
                    document.createElement("img");

                const thumbName = work.image.replace(/\.[^/.]+$/, "") + ".jpg";

                image.src = encodeURI(
                    "images/painting/" +
                    work.year +
                    "/thumbs/" +
                    thumbName
                );

                image.alt =
                    "Painting " + work.year;

                image.loading =
                    "lazy";

                link.appendChild(image);

                /* 关键：依次分发进 第1列 -> 第2列 -> 第3列 -> 第1列... */
                const targetCol = columns[index % columnCount];
                targetCol.appendChild(link);

            });

        }


        /* ========================================
           SORT BUTTON
           ======================================== */

        sortButton.addEventListener(
            "click",
            () => {

                newestFirst =
                    !newestFirst;

                sortButton.textContent =
                    newestFirst
                        ? "SORT: NEWEST → OLDEST"
                        : "SORT: OLDEST → NEWEST";

                renderArchive();

            }
        );


        /* ========================================
           SMART HEADER HIDE / SHOW ON SCROLL
           ======================================== */

        const header = document.querySelector(".site-header");
        let lastScrollY = window.pageYOffset;

        window.addEventListener("scroll", () => {
            const currentScrollY = window.pageYOffset;

            if (currentScrollY <= 80) {
                header.classList.remove("header-hidden");
                lastScrollY = currentScrollY;
                return;
            }

            if (Math.abs(currentScrollY - lastScrollY) < 10) {
                return;
            }

            if (currentScrollY > lastScrollY) {
                header.classList.add("header-hidden");
            } else {
                header.classList.remove("header-hidden");
            }

            lastScrollY = currentScrollY;
        }, { passive: true });


        /* ========================================
           窗口尺寸变化自适应
           ======================================== */

        let resizeTimer;
        window.addEventListener("resize", () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(renderArchive, 150);
        });


        /* ========================================
           INITIAL RENDER
           ======================================== */

        renderArchive();
