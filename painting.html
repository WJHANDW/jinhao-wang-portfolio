        /* ========================================
           ELEMENTS
           ======================================== */

        const archive =
            document.getElementById("painting-archive");

        const sortButton =
            document.getElementById("sort-button");


        /* ========================================
           SORT STATE
           ======================================== */

        let newestFirst = true;


        /* ========================================
           GENERATE ARCHIVE
           ======================================== */

        function renderArchive() {

            /*
             * Clear current archive before rebuilding.
             */

            archive.innerHTML = "";


            /*
             * Create a sorted copy.
             *
             * The original works array is never changed,
             * so each work keeps its original detail-page ID.
             */

            const sortedWorks = [...works].sort(
                (a, b) => {

                    const yearA =
                        Number(a.year);

                    const yearB =
                        Number(b.year);

                    return newestFirst
                        ? yearB - yearA
                        : yearA - yearB;

                }
            );


            /*
             * Get unique years in the
             * current sorting order.
             */

            const years = [
                ...new Set(
                    sortedWorks.map(
                        work => work.year
                    )
                )
            ];


            /*
             * Generate each year section.
             */

            years.forEach(year => {

                const yearWorks =
                    sortedWorks.filter(
                        work => work.year === year
                    );


                /* Create year section */

                const yearSection =
                    document.createElement("section");

                yearSection.className =
                    "archive-year";


                /* Create year title */

                const yearTitle =
                    document.createElement("h2");

                yearTitle.textContent =
                    year;


                /* Create image grid */

                const grid =
                    document.createElement("div");

                grid.className =
                    "archive-grid";


                /* Add works */

                yearWorks.forEach(work => {

                    /*
                     * Find the original index.
                     * This keeps detail-page URLs stable.
                     */

                    const globalIndex =
                        works.indexOf(work);


                    /* Create work link */

                    const link =
                        document.createElement("a");

                    link.href =
                        "painting-work.html?id=" +
                        globalIndex;

                    link.className =
                        "archive-item";


                    /* Create work image */

/* Create work image */

                 const image =
                     document.createElement("img");

                 const thumbName = work.image.replace(/\.[^/.]+$/, "") + ".jpg";

                 image.src = encodeURI(
                     "images/painting/" +
                     work.year +
                     "/thumbs/" +
                     thumbName
                 );

                    image.alt =
                        "Painting " + work.year;

                    image.loading =
                        "lazy";


                    /* Assemble work */

                    link.appendChild(image);

                    grid.appendChild(link);

                });


                /* Assemble year */

                yearSection.appendChild(
                    yearTitle
                );

                yearSection.appendChild(
                    grid
                );

                archive.appendChild(
                    yearSection
                );

            });

        }


        /* ========================================
           SORT BUTTON
           ======================================== */

        sortButton.addEventListener(
            "click",
            () => {

                newestFirst =
                    !newestFirst;


                /*
                 * Update button label.
                 */

                sortButton.textContent =
                    newestFirst
                        ? "SORT: NEWEST → OLDEST"
                        : "SORT: OLDEST → NEWEST";


                /*
                 * Rebuild archive.
                 */

                renderArchive();

            }
        );


        /* ========================================
           INITIAL RENDER
           ======================================== */

        renderArchive();
